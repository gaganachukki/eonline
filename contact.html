<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="contact.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

<div id="navbar"></div>

<section class="cover-hero" style="background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('assets/contact_hero.webp'); background-size: cover; background-position: center;">
  <div class="cover-content">
    <h1>Get In Touch</h1>
    <p>We're Here to Help You Succeed</p>
  </div>
</section>

<section class="contact">
  <div class="contact-container">
    <div class="contact-info" data-aos="fade-right">
      
      <div class="info-items">
        <div class="info-item" data-aos="fade-up" data-aos-delay="100">
          <i class="fa-solid fa-location-dot"></i>
          <div>
            <h4>Office Address</h4>
            <span>Salem, Tamil Nadu, India</span>
          </div>
        </div>
        <div class="info-item" data-aos="fade-up" data-aos-delay="200">
          <i class="fa-solid fa-envelope"></i>
          <div>
            <h4>Email Us</h4>
            <span>hello@stackly.com</span>
          </div>
        </div>
        <div class="info-item" data-aos="fade-up" data-aos-delay="300">
          <i class="fa-solid fa-phone"></i>
          <div>
            <h4>Call Us</h4>
            <span>+1 (555) 123-4567</span>
          </div>
        </div>
      </div>
    </div>

    <div class="contact-box" data-aos="fade-left">
      <h1>Send a Message</h1>
      <form action="404.html">
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="5" placeholder="Your Message"></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>
</section>

<section class="social-media">
  <div class="social-content" data-aos="zoom-in">
    <h2>Connect With Us</h2>
    <p>Follow our social media channels for the latest updates, coding tips, and community news.</p>
    <div class="social-links">
      <a href="404.html" class="social-icon" data-aos="zoom-in" data-aos-delay="100"><i class="fa-brands fa-twitter"></i></a>
      <a href="404.html" class="social-icon" data-aos="zoom-in" data-aos-delay="200"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="404.html" class="social-icon" data-aos="zoom-in" data-aos-delay="300"><i class="fa-brands fa-instagram"></i></a>
      <a href="404.html" class="social-icon" data-aos="zoom-in" data-aos-delay="400"><i class="fa-brands fa-linkedin-in"></i></a>
      <a href="404.html" class="social-icon" data-aos="zoom-in" data-aos-delay="500"><i class="fa-brands fa-github"></i></a>
    </div>
  </div>
</section>

<section class="map" data-aos="fade-up">
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3168.63929062107!2d-122.0838511!3d37.3860517!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb7495bec0189%3A0x7c17d44a466baf9b!2sMountain%20View%2C%20CA!5e0!3m2!1sen!2sus!4v1699999999999!5m2!1sen!2sus" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</section>

<div id="footer"></div>

<script>
fetch("navbar.html")
.then(res => res.text())
.then(data => {
  document.getElementById("navbar").innerHTML = data;
  const currentPath = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll(".nav-links a").forEach(link => {
    if (link.getAttribute("href") === currentPath) {
      link.classList.add("active");
    }
  });
  const menuIcon = document.querySelector(".menu-icon");
  const navLinks = document.querySelector(".nav-links");
  if (menuIcon && navLinks) {
    menuIcon.addEventListener("click", () => {
      navLinks.classList.toggle("active-menu");
    });
  }
  const closeIcon = document.querySelector(".close-icon");
  if (closeIcon && navLinks) {
    closeIcon.addEventListener("click", () => {
      navLinks.classList.remove("active-menu");
    });
  }
});

fetch("footer.html")
.then(res => res.text())
.then(data => {
  document.getElementById("footer").innerHTML = data;
});
</script>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({
    once: true,
    offset: 100,
  });
</script>

</body>
</html>
