<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly Academy</title>


  <link rel="stylesheet" href="404.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>



  <!-- 404 Section -->
  <section class="error-page">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    
    <div class="error-content" data-aos="zoom-in" data-aos-duration="1000">
      <div class="error-code">404!</div>
      <h2 class="error-title">Oops! Class Not Found</h2>
      <p class="error-desc">It looks like the page you are looking for has been moved, deleted, or you just took a wrong turn in the campus. Let's get you back to learning.</p>
      <div class="btn-group">
        <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Back to Homepage</a>
        <a href="javascript:history.back()" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
      </div>
    </div>
  </section>





  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      once: true,
      offset: 100,
    });
  </script>
</body>
</html>
